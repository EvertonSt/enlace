[build]
  base = "."
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @enlace/web build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = ""

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
